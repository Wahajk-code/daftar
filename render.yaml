# Render blueprint for the API. Create it from the dashboard (New, Blueprint) after the repository is on GitHub. Values marked
# sync: false are typed into the Render dashboard by the owner; nothing secret is kept in this file.
services:
  - type: web
    name: daftar-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DISPLAY_TIMEZONE
        value: Asia/Karachi
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: MAIL_BACKEND
        value: resend
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BFF_SHARED_SECRET
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
