name: daftar

# Development defaults live here so the stack starts without a .env file. Anything in .env overrides them.
# The development passwords and key below are for local use only; production refuses a weak SECRET_KEY.

x-backend-env: &backend-env
  TZ: UTC
  PYTHONDONTWRITEBYTECODE: "1"
  WATCHFILES_FORCE_POLLING: "true"
  DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Karachi}
  GIT_SHA: ${GIT_SHA:-dev}

services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      TZ: UTC
      POSTGRES_USER: daftar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daftar_dev_password}
      POSTGRES_DB: daftar
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-daftar_app_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daftar -d daftar"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    environment:
      <<: *backend-env
      ENVIRONMENT: development
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-dev-only-key-do-not-use-outside-local-development}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-memory}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-dev-bff-shared-secret-for-local-use-only}
      MAIL_BACKEND: ${MAIL_BACKEND:-console}
      MAIL_FROM: ${MAIL_FROM:-Daftar <no-reply@daftar.pk>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://daftar_app:${APP_DB_PASSWORD:-daftar_app_dev_password}@postgres:5432/daftar
      MIGRATION_DATABASE_URL: postgresql+psycopg://daftar:${POSTGRES_PASSWORD:-daftar_dev_password}@postgres:5432/daftar
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      TZ: UTC
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      API_BASE_URL: http://backend:8000
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-dev-bff-shared-secret-for-local-use-only}
      DEMO_MODE: ${DEMO_MODE:-true}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Karachi}
      OPENAPI_FILE: /openapi.json
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - ./backend/openapi.json:/openapi.json:ro
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "8025:8025"
      - "1025:1025"

  backend-test:
    build: ./backend
    profiles: ["test"]
    # The whole gate in order: lint, format, types, tests. Override the command to run one piece.
    command: ["sh", "-c", "ruff check . && ruff format --check . && mypy && pytest"]
    environment:
      <<: *backend-env
      ENVIRONMENT: test
      SECRET_KEY: test-only-key-do-not-use-outside-automated-tests
      ARGON2_TIME_COST: "1"
      ARGON2_MEMORY_KIB: "1024"
      ARGON2_PARALLELISM: "1"
      BFF_SHARED_SECRET: test-bff-secret-for-automated-tests-only
      DATABASE_URL: postgresql+psycopg://daftar_app:${APP_DB_PASSWORD:-daftar_app_dev_password}@postgres:5432/daftar_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://daftar:${POSTGRES_PASSWORD:-daftar_dev_password}@postgres:5432/daftar_test
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend-test:
    build: ./frontend
    profiles: ["test"]
    command: ["sh", "-c", "pnpm lint && pnpm typecheck"]
    environment:
      TZ: UTC
      OPENAPI_FILE: /openapi.json
    volumes:
      - ./frontend:/app
      - ./backend/openapi.json:/openapi.json:ro
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
